name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --timeout=60
      - name: Run scenario smoke tests
        run: |
          python -m scripts.run_scenario static_obstacle
          python -m scripts.run_scenario crossing_animal
          python -m scripts.run_scenario multi_animal
          python -m scripts.run_scenario sensor_noise
          python -m scripts.run_scenario occluded_siren
          python -m scripts.run_scenario free_world
          python -m scripts.run_scenario city_roads
          python -m scripts.run_scenario indian_road